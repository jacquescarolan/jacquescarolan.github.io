name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.164.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pinned Hugo Extended
        shell: bash
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          curl -fsSLO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${archive}$" "hugo_${HUGO_VERSION}_checksums.txt" > selected-checksum.txt
          sha256sum -c selected-checksum.txt
          tar -xzf "${archive}" hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          hugo version

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build site
        run: hugo --minify --environment production --cleanDestinationDir

      - name: Validate legacy routes and downloads
        run: ruby scripts/check-legacy-routes.rb build data/legacy-routes.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
