<ul class="content-list">
  {{ range .Pages.ByWeight }}
    {{ $item := . }}
    <li>
      <h3>
        {{ with .Params.external_url }}
          <a href="{{ . }}">{{ $item.Title }}</a>
        {{ else }}
          <a href="{{ $item.RelPermalink }}">{{ $item.Title }}</a>
        {{ end }}
      </h3>
      {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
      {{ with .Params.source }}<p class="meta">{{ . }}</p>{{ end }}
    </li>
  {{ end }}
</ul>
