<header class="site-header">
  <div class="container header-inner">
    <a class="site-name" href="/">{{ site.Title }}</a>
    {{ with site.Home.Params.navigation }}
      <nav aria-label="Primary navigation">
        <ul class="nav-list">
          {{ range . }}
            <li><a href="{{ .url }}">{{ .label }}</a></li>
          {{ end }}
        </ul>
      </nav>
    {{ end }}
  </div>
</header>
