{{ define "main" }}
  <article class="container page">
    <header class="page-header">
      <p class="eyebrow"><a href="{{ .CurrentSection.RelPermalink }}">{{ .CurrentSection.Title }}</a></p>
      <h1>{{ .Title }}</h1>
      {{ with .Params.summary }}<p class="lede">{{ . }}</p>{{ end }}
    </header>
    <div class="prose">{{ .Content }}</div>
    {{ with .Params.external_url }}
      <p><a href="{{ . }}">Visit the original conversation or feature</a></p>
    {{ end }}
  </article>
{{ end }}
