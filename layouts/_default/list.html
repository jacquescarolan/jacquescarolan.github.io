{{ define "main" }}
  <div class="container page">
    <header class="page-header">
      <h1>{{ .Title }}</h1>
      {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
    </header>
    <div class="prose">{{ .Content }}</div>
    {{ if .Pages }}
      {{ partial "content-list.html" (dict "Pages" .Pages) }}
    {{ end }}
  </div>
{{ end }}
